<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa do Dia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0808">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>Mapa do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first, three tabs (Hoje / Tarefas / Histórico). Hoje = tray of tappable task chips on top, the day's ruled log below. Single dark look, red on black, by choice. */
:root {
  --ink: #0c0808;
  --coal: #161010;
  --coal-2: #211718;
  --line: #36282b;
  --paper: #f5ede9;
  --ash: #a8979a;
  --red: #d91f36;
  --red-hot: #ff5568;
  --red-mid: #8a2231;
  --red-deep: #3b0f17;
  --f-display: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html { background: var(--ink); }
body {
  background: var(--ink);
  color: var(--paper);
  font: 400 16px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(104px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--red-hot); outline-offset: 2px; }
#app { max-width: 560px; margin: 0 auto; min-width: 0; }

/* Masthead */
.mast-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.eyebrow { margin: 0; font: 500 12px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--red-hot); }
.sync { margin: 0; font: 400 12px/1.2 var(--f-mono); color: var(--ash); }
.mast-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 6px; }
h1 { margin: 0; font: 800 clamp(34px, 11vw, 48px)/1 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.tally { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; padding-bottom: 4px; }
.tally strong { font: 800 44px/1 var(--f-display); color: var(--red-hot); font-variant-numeric: tabular-nums; }
.tally span { font: 500 12px/1.4 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ash); }
.sub { margin: 10px 0 0; color: var(--ash); max-width: 46ch; }

h2 { margin: 28px 0 12px; font: 700 20px/1.2 var(--f-display); letter-spacing: -.01em; }

/* Chip bank (Duolingo-style word bank) */
.bank { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 50px;
  font: 600 17px/1.15 var(--f-body); color: var(--paper); text-align: left;
  background: var(--coal-2); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 14px;
  padding: 10px 14px 8px;
  transition: transform .06s ease, border-bottom-width .06s ease, border-color .15s ease;
}
.chip:active { transform: translateY(3px); border-bottom-width: 2px; }
.chip.has { border-color: var(--red-mid); border-bottom-color: var(--red); }
.chip .n {
  min-width: 26px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--red); color: #fff;
  font: 500 13px/22px var(--f-mono); text-align: center; font-variant-numeric: tabular-nums;
}
.chip.add { background: transparent; border-style: dashed; border-bottom-width: 2px; color: var(--ash); padding-bottom: 10px; }
.chip.add:active { transform: translateY(1px); }
.chip.add svg { color: var(--red-hot); }
.flier { position: fixed; z-index: 30; margin: 0; pointer-events: none; }

/* Ruled lists: log, tasks, history */
.log, .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row, .trow { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); min-height: 56px; }
.row { padding-left: 2px; }
.row.fresh { animation: drop .28s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
.time { flex: none; width: 52px; font: 400 14px/1 var(--f-mono); color: var(--red-hot); font-variant-numeric: tabular-nums; }
.what { flex: 1; min-width: 0; font-size: 17px; overflow-wrap: anywhere; }
.x {
  flex: none; width: 48px; height: 48px; display: grid; place-items: center;
  background: none; border: 0; color: var(--ash); border-radius: 50%;
}
.x:active { background: var(--red-deep); color: var(--paper); }
.empty { margin: 0; padding: 18px 0; color: var(--ash); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); max-width: 46ch; }

/* Tasks tab */
.trow { padding: 8px 0; }
.tname { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.meta { font: 400 12px/1.3 var(--f-mono); color: var(--ash); }
.trow.editing { flex-wrap: wrap; padding: 12px 0; }
.trow.editing input { flex: 1 1 100%; }
.edit-actions { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.btn {
  min-height: 48px; padding: 0 18px; border-radius: 14px; font: 600 16px/1 var(--f-body);
  border: 2px solid var(--line); background: transparent; color: var(--paper);
}
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:active { background: #b81a2d; }
.btn.ghost:active { background: var(--coal-2); }
.btn.text { border-color: transparent; color: var(--ash); }
.btn.danger { border-color: var(--red-mid); color: var(--red-hot); }
.btn.danger.sure { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }

/* History */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; }
.wcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.wbar { width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: var(--red-mid); }
.wbar.zero { background: var(--line); height: 3px !important; }
.wcol.today .wbar:not(.zero) { background: var(--red); }
.wnum { font: 500 12px/1 var(--f-mono); color: var(--ash); font-variant-numeric: tabular-nums; }
.wcol.today .wnum { color: var(--red-hot); }
.wday { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ash); }
.wcol.today .wday { color: var(--paper); }
.top { display: flex; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.top .count { font: 500 14px/1 var(--f-mono); color: var(--red-hot); font-variant-numeric: tabular-nums; min-width: 34px; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 0 8px; }
.dayhead .eyebrow { color: var(--paper); }
.dayhead .tot { font: 500 13px/1 var(--f-mono); color: var(--ash); }
.hrow { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.hrow .what { font-size: 16px; }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--ink); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tab {
  position: relative; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: none; border: 0; color: var(--ash); font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase;
}
.tab[aria-current="page"] { color: var(--red-hot); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -7px; left: 28%; right: 28%; height: 3px; background: var(--red); border-radius: 0 0 3px 3px; }

/* New-task sheet (sits near the top so the keyboard never covers it) */
#scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .72); }
.sheet {
  position: fixed; z-index: 21; top: calc(env(safe-area-inset-top, 0px) + 9vh);
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 520px; margin-inline: auto; background: var(--coal); border: 2px solid var(--line); border-bottom: 5px solid var(--red);
  border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
}
.sheet h2 { margin: 0; }
.sheet label { font: 500 12px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
input[type="text"] {
  width: 100%; box-sizing: border-box; min-height: 50px; padding: 0 14px; font-size: 16px; color: var(--paper);
  background: var(--ink); border: 2px solid var(--line); border-radius: 12px;
}
input[type="text"]:focus { border-color: var(--red-hot); outline: none; }
.err { margin: 0; color: var(--red-hot); font-size: 14px; }
.sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

@media (prefers-reduced-motion: reduce) {
  .row.fresh { animation: none; }
  .chip { transition: none; }
}
</style>
</head>
<body>
<main id="app"><div id="view"></div></main>

<nav class="tabs" aria-label="Secções">
  <div class="tabs-in">
    <button type="button" class="tab" data-tab="hoje">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6.5"/></svg>
      Hoje
    </button>
    <button type="button" class="tab" data-tab="tarefas">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.5" cy="7" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="17" r=".8"/></svg>
      Tarefas
    </button>
    <button type="button" class="tab" data-tab="hist">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-9M12 20V5M19 20v-6"/></svg>
      Histórico
    </button>
  </div>
</nav>

<div id="scrim" hidden></div>
<form id="sheet" class="sheet" hidden autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">Nova tarefa</h2>
  <label for="newName">Como lhe chamas?</label>
  <input id="newName" name="newName" type="text" maxlength="60" placeholder="Ex.: Limpar o frigorífico" enterkeyhint="done">
  <p id="sheetErr" class="err" role="alert" hidden></p>
  <div class="sheet-actions">
    <button type="submit" class="btn primary" id="saveReg">Guardar e registar agora</button>
    <button type="button" class="btn ghost" id="saveOnly">Só guardar</button>
    <button type="button" class="btn text" id="cancelSheet">Cancelar</button>
  </div>
</form>

<script>
(function () {
  'use strict';

  var KEY = 'mapa-do-dia-v1';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var uid = function () { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var dayStart = function (back) { var d = new Date(); d.setDate(d.getDate() - (back || 0)); d.setHours(0, 0, 0, 0); return d.getTime(); };
  var sod = function (t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  var fmtTime = function (t) { return new Date(t).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }); };
  var fWeekday = new Intl.DateTimeFormat('pt-PT', { weekday: 'long' });
  var fDM = new Intl.DateTimeFormat('pt-PT', { day: 'numeric', month: 'long' });
  var fDay = new Intl.DateTimeFormat('pt-PT', { weekday: 'long', day: 'numeric', month: 'short' });
  var fNarrow = new Intl.DateTimeFormat('pt-PT', { weekday: 'narrow' });

  var ICONS = {
    plus: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    x: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  function icon(n) { var s = document.createElement('span'); s.style.display = 'inline-flex'; s.innerHTML = ICONS[n]; return s; }

  function el(tag, props) {
    var n = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (v === true) n.setAttribute(k, '');
        else if (v !== false && v != null) n.setAttribute(k, v);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      kids.forEach(function (c) {
        if (c == null || c === false) return;
        n.append(c.nodeType ? c : document.createTextNode(c));
      });
    }
    return n;
  }

  /* ---------- State ---------- */
  var SEED = ['Lavar o fogão', 'Lavar a loiça', 'Fazer a cama', 'Pôr a roupa a lavar', 'Estender a roupa',
    'Passar o aspirador', 'Limpar a casa de banho', 'Fazer o jantar', 'Levar o lixo', 'Regar as plantas'];

  function seed() {
    return { tasks: SEED.map(function (n) { return { id: uid(), name: n }; }), log: [], u: 0, seeded: true };
  }
  function validState(o) {
    return o && Array.isArray(o.tasks) && Array.isArray(o.log) &&
      o.tasks.every(function (t) { return t && typeof t.id === 'string' && typeof t.name === 'string'; });
  }
  function loadLocal() {
    try {
      var r = localStorage.getItem(KEY);
      if (r) { var o = JSON.parse(r); if (validState(o)) return o; }
    } catch (e) {}
    return null;
  }
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var S = loadLocal() || seed();
  var tab = 'hoje', editingId = null, confirmId = null, confirmTimer = 0;
  var lastAdded = null, sync = 'local', pendingRender = false;

  /* ---------- Persistence: this phone first, then the user's own private store ---------- */
  var dbDoc = null, saving = false, dirty = false, saveTimer = 0;

  function prune() {
    var min = Date.now() - 120 * 864e5;
    S.log = S.log.filter(function (e) { return e.t >= min; }).slice(-2000);
  }
  function persist() {
    prune();
    S.u = Date.now();
    saveLocal();
    scheduleRemote();
  }
  function scheduleRemote() {
    if (!dbDoc) return;
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 500);
  }
  async function flush() {
    if (saving || !dbDoc || !dirty) return;
    saving = true; dirty = false;
    try { await dbDoc.set(clone(S)); setSync('ok'); }
    catch (e) { setSync('local'); }
    saving = false;
    if (dirty) scheduleRemote();
  }
  function syncText() { return sync === 'ok' ? 'Sincronizado com a tua conta' : 'Guardado neste telemóvel'; }
  function setSync(v) { sync = v; var n = $('#sync'); if (n) n.textContent = syncText(); }

  function onRemote(snap) {
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    var d = snap.exists ? snap.data() : null;
    if (d && validState(d)) {
      var ru = d.u || 0, lu = S.u || 0;
      if (ru > lu) {
        S = clone(d); saveLocal();
        var a = document.activeElement;
        if (a && (a.tagName === 'INPUT')) pendingRender = true; else render();
      } else if (ru < lu) { scheduleRemote(); }
      if (!snap.metadata || !snap.metadata.fromCache) setSync('ok');
    } else if ((S.u || 0) > 0) {
      scheduleRemote();
    } else if (!snap.metadata || !snap.metadata.fromCache) {
      setSync('ok');
    }
  }
  document.addEventListener('focusout', function () {
    if (pendingRender) { setTimeout(function () { var a = document.activeElement; if (!(a && a.tagName === 'INPUT')) { pendingRender = false; render(); } }, 50); }
  });


  /* ---------- Actions ---------- */
  function register(task) {
    var e = { id: uid(), tid: task.id, name: task.name, t: Date.now() };
    S.log.push(e);
    lastAdded = e.id;
    persist();
  }

  function flyFrom(node) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var target = $('#logTop');
    if (!target || !node.animate) return;
    var a = node.getBoundingClientRect(), b = target.getBoundingClientRect();
    var c = node.cloneNode(true);
    c.classList.add('flier');
    c.style.left = a.left + 'px'; c.style.top = a.top + 'px';
    c.style.width = a.width + 'px'; c.style.height = a.height + 'px';
    document.body.appendChild(c);
    var ty = Math.min(b.top, window.innerHeight - 110);
    var dx = (b.left + 24) - a.left, dy = ty - a.top;
    var anim = c.animate(
      [{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.92)', opacity: 0 }],
      { duration: 440, easing: 'cubic-bezier(.3,.7,.2,1)' }
    );
    anim.onfinish = function () { c.remove(); };
  }

  function tap(task, btn) {
    flyFrom(btn);
    register(task);
    render();
  }

  function nameTaken(name, exceptId) {
    var k = name.toLowerCase();
    return S.tasks.some(function (t) { return t.id !== exceptId && t.name.toLowerCase() === k; });
  }
  function cleanName(v) { return String(v || '').replace(/\s+/g, ' ').trim(); }

  /* ---------- Sheet: new task ---------- */
  var sheet = $('#sheet'), scrim = $('#scrim'), nameIn = $('#newName'), errP = $('#sheetErr');
  function openSheet() {
    nameIn.value = ''; errP.hidden = true;
    scrim.hidden = false; sheet.hidden = false;
    nameIn.focus();
  }
  function closeSheet() { sheet.hidden = true; scrim.hidden = true; }
  function showErr(msg) { errP.textContent = msg; errP.hidden = false; nameIn.focus(); }
  function saveNew(andRegister) {
    var name = cleanName(nameIn.value);
    if (!name) { showErr('Escreve o nome da tarefa.'); return; }
    if (nameTaken(name)) { showErr('Já tens a tarefa “' + name + '”.'); return; }
    var t = { id: uid(), name: name };
    S.tasks.push(t);
    if (andRegister) register(t); else persist();
    closeSheet();
    render();
  }
  sheet.addEventListener('submit', function (e) { e.preventDefault(); saveNew(true); });
  $('#saveOnly').addEventListener('click', function () { saveNew(false); });
  $('#cancelSheet').addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

  /* ---------- Views ---------- */
  function hoje() {
    var now = new Date();
    var start = sod(now);
    var today = S.log.filter(function (e) { return e.t >= start; }).sort(function (a, b) { return b.t - a.t; });
    var counts = {};
    today.forEach(function (e) { counts[e.tid] = (counts[e.tid] || 0) + 1; });

    var chips = S.tasks.map(function (t) {
      var n = counts[t.id] || 0;
      var b = el('button', { type: 'button', class: 'chip' + (n ? ' has' : ''), 'aria-label': 'Registar ' + t.name + (n ? ' (feita ' + n + (n === 1 ? ' vez' : ' vezes') + ' hoje)' : '') },
        el('span', { text: t.name }), n ? el('span', { class: 'n', text: '×' + n }) : null);
      b.addEventListener('click', function () { tap(t, b); });
      return b;
    });
    var add = el('button', { type: 'button', class: 'chip add' }, icon('plus'), 'Nova tarefa');
    add.addEventListener('click', openSheet);

    var logBody;
    if (today.length) {
      logBody = el('ol', { class: 'log' }, today.map(function (e) {
        var rm = el('button', { type: 'button', class: 'x', 'aria-label': 'Remover ' + e.name + ' das ' + fmtTime(e.t) }, icon('x'));
        rm.addEventListener('click', function () {
          S.log = S.log.filter(function (x) { return x.id !== e.id; });
          persist(); render();
        });
        return el('li', { class: 'row' + (e.id === lastAdded ? ' fresh' : '') },
          el('span', { class: 'time', text: fmtTime(e.t) }), el('span', { class: 'what', text: e.name }), rm);
      }));
    } else {
      logBody = el('p', { class: 'empty', text: 'Ainda nada registado hoje. Toca numa tarefa acima quando começares ou acabares.' });
    }

    return el('div', null,
      el('header', null,
        el('div', { class: 'mast-top' },
          el('p', { class: 'eyebrow', text: fWeekday.format(now) }),
          el('p', { class: 'sync', id: 'sync', text: syncText() })),
        el('div', { class: 'mast-main' },
          el('h1', { text: fDM.format(now) }),
          el('div', { class: 'tally' }, el('strong', { text: String(today.length) }), el('span', { text: today.length === 1 ? 'feita' : 'feitas' })))),
      el('section', null,
        el('h2', { text: 'O que estás a fazer?' }),
        el('div', { class: 'bank' }, chips, add)),
      el('section', null,
        el('h2', { text: 'Registado hoje' }),
        el('div', { id: 'logTop' }, logBody)));
  }

  function editRow(t) {
    var input = el('input', { type: 'text', id: 'edit-' + t.id, maxlength: '60', value: t.name, 'aria-label': 'Nome da tarefa', enterkeyhint: 'done' });
    input.value = t.name;
    var err = el('p', { class: 'err', role: 'alert', hidden: true });
    function save() {
      var name = cleanName(input.value);
      if (!name) { err.textContent = 'O nome não pode ficar vazio.'; err.hidden = false; return; }
      if (nameTaken(name, t.id)) { err.textContent = 'Já tens a tarefa “' + name + '”.'; err.hidden = false; return; }
      t.name = name;
      S.log.forEach(function (e) { if (e.tid === t.id) e.name = name; });
      editingId = null; confirmId = null;
      persist(); render();
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); save(); } });
    var del = el('button', { type: 'button', class: 'btn danger small' + (confirmId === t.id ? ' sure' : ''), text: confirmId === t.id ? 'Confirmar: apagar' : 'Apagar' });
    del.addEventListener('click', function () {
      if (confirmId === t.id) {
        S.tasks = S.tasks.filter(function (x) { return x.id !== t.id; });
        editingId = null; confirmId = null; clearTimeout(confirmTimer);
        persist(); render();
      } else {
        confirmId = t.id;
        del.textContent = 'Confirmar: apagar'; del.classList.add('sure');
        clearTimeout(confirmTimer);
        confirmTimer = setTimeout(function () { if (confirmId === t.id) { confirmId = null; del.textContent = 'Apagar'; del.classList.remove('sure'); } }, 3500);
      }
    });
    var ok = el('button', { type: 'button', class: 'btn primary small', text: 'Guardar' });
    ok.addEventListener('click', save);
    var close = el('button', { type: 'button', class: 'btn text small', text: 'Fechar' });
    close.addEventListener('click', function () { editingId = null; confirmId = null; render(); });
    return el('li', { class: 'trow editing' }, input, err, el('div', { class: 'edit-actions' }, ok, del, close));
  }

  function tarefas() {
    var since = dayStart(6);
    var add = el('button', { type: 'button', class: 'btn primary', text: 'Nova tarefa' });
    add.addEventListener('click', openSheet);
    var rows = S.tasks.map(function (t) {
      if (editingId === t.id) return editRow(t);
      var n = S.log.filter(function (e) { return e.tid === t.id && e.t >= since; }).length;
      var ed = el('button', { type: 'button', class: 'btn ghost small', text: 'Editar', 'aria-label': 'Editar ' + t.name });
      ed.addEventListener('click', function () { editingId = t.id; confirmId = null; render(); var i = document.getElementById('edit-' + t.id); if (i) i.focus(); });
      return el('li', { class: 'trow' },
        el('div', { class: 'tname' },
          el('span', { class: 'what', text: t.name }),
          el('span', { class: 'meta', text: n ? n + (n === 1 ? ' vez' : ' vezes') + ' nos últimos 7 dias' : 'ainda não feita esta semana' })),
        ed);
    });
    return el('div', null,
      el('div', { class: 'head-row' },
        el('div', null, el('p', { class: 'eyebrow', text: S.tasks.length + (S.tasks.length === 1 ? ' tarefa' : ' tarefas') }), el('h1', { text: 'As tuas tarefas' })),
        add),
      el('p', { class: 'sub', text: 'São as que aparecem no ecrã Hoje. Muda o nome ou apaga com Editar. As já registadas no histórico mantêm-se.' }),
      el('h2', { text: 'Lista' }),
      S.tasks.length ? el('ul', { class: 'list' }, rows) : el('p', { class: 'empty', text: 'Não tens tarefas guardadas. Toca em Nova tarefa para criar a primeira.' }));
  }

  function hist() {
    var days = [];
    for (var i = 6; i >= 0; i--) days.push(dayStart(i));
    var byDay = {};
    S.log.forEach(function (e) { var k = sod(e.t); (byDay[k] = byDay[k] || []).push(e); });
    var weekCounts = days.map(function (d) { return (byDay[d] || []).length; });
    var max = Math.max.apply(null, weekCounts.concat([1]));

    var week = el('div', { class: 'week', role: 'img', 'aria-label': 'Tarefas feitas nos últimos 7 dias: ' + weekCounts.join(', ') },
      days.map(function (d, idx) {
        var n = weekCounts[idx];
        var bar = el('div', { class: 'wbar' + (n ? '' : ' zero') });
        bar.style.height = (n ? Math.max(6, Math.round(n / max * 72)) : 3) + 'px';
        return el('div', { class: 'wcol' + (idx === 6 ? ' today' : '') },
          el('span', { class: 'wnum', text: String(n) }), bar,
          el('span', { class: 'wday', text: fNarrow.format(new Date(d)) }));
      }));

    var since = days[0], tally = {};
    S.log.forEach(function (e) { if (e.t >= since) { var k = e.tid || e.name; tally[k] = tally[k] || { name: e.name, n: 0 }; tally[k].n++; } });
    var top = Object.keys(tally).map(function (k) { return tally[k]; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 5);

    var keys = Object.keys(byDay).map(Number).sort(function (a, b) { return b - a; }).slice(0, 30);
    var yesterday = dayStart(1), todayS = dayStart(0);
    var groups = keys.map(function (k) {
      var entries = byDay[k].slice().sort(function (a, b) { return a.t - b.t; });
      var label = k === todayS ? 'Hoje' : k === yesterday ? 'Ontem' : fDay.format(new Date(k));
      return el('section', null,
        el('div', { class: 'dayhead' }, el('p', { class: 'eyebrow', text: label }), el('span', { class: 'tot', text: entries.length + (entries.length === 1 ? ' tarefa' : ' tarefas') })),
        el('div', { class: 'list' }, entries.map(function (e) {
          return el('div', { class: 'hrow' }, el('span', { class: 'time', text: fmtTime(e.t) }), el('span', { class: 'what', text: e.name }));
        })));
    });

    return el('div', null,
      el('p', { class: 'eyebrow', text: 'Últimos 7 dias' }),
      el('h1', { text: 'Histórico' }),
      el('div', { style: 'margin-top:22px' }, week),
      top.length ? el('section', null,
        el('h2', { text: 'Mais feitas esta semana' }),
        el('div', { class: 'list' }, top.map(function (t) {
          return el('div', { class: 'top' }, el('span', { class: 'count', text: '×' + t.n }), el('span', { class: 'what', text: t.name }));
        }))) : null,
      groups.length ? groups : el('p', { class: 'empty', style: 'margin-top:24px', text: 'Quando registares tarefas no ecrã Hoje, os dias aparecem aqui.' }));
  }

  function render() {
    var v = $('#view');
    v.replaceChildren(tab === 'hoje' ? hoje() : tab === 'tarefas' ? tarefas() : hist());
    document.querySelectorAll('.tab').forEach(function (b) {
      b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false');
    });
    lastAdded = null;
  }

  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.dataset.tab; editingId = null; confirmId = null;
      render(); window.scrollTo(0, 0);
    });
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
